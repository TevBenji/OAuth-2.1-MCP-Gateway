# GitHub Actions workflow for OAuth 2.1 MCP Gateway

name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  schedule:
    # Run performance tests daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - staging
          - production
      rollback_version:
        description: 'Version to rollback to (optional)'
        required: false
        type: string
      skip_tests:
        description: 'Skip tests during deployment'
        required: false
        default: false
        type: boolean

jobs:
  # Build and test job
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      # Install dependencies
      - name: Install dependencies
        run: npm ci
        
      # Type checking
      - name: Type checking
        run: npm run type-check
        
      # Run linting
      - name: Run linting
        run: npm run lint
        
      # Run unit tests
      - name: Run unit tests
        run: npm run test -- --run
        
      # Run integration tests
      - name: Run integration tests
        run: npm run test:integration -- --run
        
      # Run security tests
      - name: Run security tests
        run: npm run test:security -- --run
        
      # Run performance tests
      - name: Run performance tests
        run: npm run test:performance -- --run
        
      # Build project
      - name: Build project
        run: npm run build
        
      # Upload build artifacts
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: build-artifacts
          path: |
            dist/
            wrangler.toml
          retention-days: 7

  # Deploy to Vercel (development)
  deploy-vercel-development:
    name: Deploy to Vercel (Development)
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: vercel-development

    # Only run on develop branch pushes or manual dispatch to development
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'development')

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Install Vercel CLI
      - name: Install Vercel CLI
        run: npm install -g vercel

      # Run Neon database migrations
      - name: Run Neon database migrations
        run: npm run db:migrate:neon up
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_DEV }}

      # Deploy to Vercel (preview)
      - name: Deploy to Vercel (preview)
        run: vercel --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Run deployment verification tests
      - name: Run deployment verification tests (Vercel)
        run: npm run test:deployment -- --run
        env:
          GATEWAY_URL: ${{ secrets.VERCEL_DEVELOPMENT_GATEWAY_URL }}
          API_KEY: ${{ secrets.DEVELOPMENT_API_KEY }}

  # Deploy to Cloudflare (development)
  deploy-cloudflare-development:
    name: Deploy to Cloudflare (Development)
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: development

    # Only run on develop branch pushes or manual dispatch to development
    if: github.ref == 'refs/heads/develop' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'development')

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Download build artifacts
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Setup Cloudflare CLI
      - name: Setup Cloudflare CLI
        run: npm install -g wrangler

      # Run database migrations
      - name: Run database migrations
        run: node scripts/migrate.js up development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Deploy to Cloudflare Workers (development)
      - name: Deploy to Cloudflare Workers (development)
        run: node scripts/deploy.js deploy development
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JWT_SECRET: ${{ secrets.DEVELOPMENT_JWT_SECRET }}

      # Run deployment verification tests
      - name: Run deployment verification tests
        run: npm run test:deployment -- --run
        env:
          GATEWAY_URL: ${{ secrets.DEVELOPMENT_GATEWAY_URL }}
          API_KEY: ${{ secrets.DEVELOPMENT_API_KEY }}

  # Deploy to Vercel (staging)
  deploy-vercel-staging:
    name: Deploy to Vercel (Staging)
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: vercel-staging

    # Only run on main branch pushes or manual dispatch to staging
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Install Vercel CLI
      - name: Install Vercel CLI
        run: npm install -g vercel

      # Run Neon database migrations
      - name: Run Neon database migrations
        run: npm run db:migrate:neon up
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_STAGING }}

      # Deploy to Vercel (preview)
      - name: Deploy to Vercel (preview)
        run: vercel --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Run deployment verification tests
      - name: Run deployment verification tests (Vercel)
        run: npm run test:deployment -- --run
        env:
          GATEWAY_URL: ${{ secrets.VERCEL_STAGING_GATEWAY_URL }}
          API_KEY: ${{ secrets.STAGING_API_KEY }}

  # Deploy to Cloudflare (staging)
  deploy-cloudflare-staging:
    name: Deploy to Cloudflare (Staging)
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: staging

    # Only run on main branch pushes or manual dispatch to staging
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'staging')

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Download build artifacts
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Setup Cloudflare CLI
      - name: Setup Cloudflare CLI
        run: npm install -g wrangler

      # Run database migrations
      - name: Run database migrations
        run: node scripts/migrate.js up staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_STAGING }}

      # Deploy infrastructure with Terraform
      - name: Deploy infrastructure with Terraform
        run: |
          cd terraform
          terraform init
          terraform plan -var-file=staging.tfvars -out=staging.tfplan
          terraform apply staging.tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_STAGING }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID_STAGING }}
          TF_VAR_jwt_secret: ${{ secrets.STAGING_JWT_SECRET }}

      # Deploy to Cloudflare Workers (staging)
      - name: Deploy to Cloudflare Workers (staging)
        run: node scripts/deploy.js deploy staging
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_STAGING }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_STAGING }}
          JWT_SECRET: ${{ secrets.STAGING_JWT_SECRET }}

      # Run deployment verification tests
      - name: Run deployment verification tests
        run: npm run test:deployment -- --run
        env:
          GATEWAY_URL: ${{ secrets.STAGING_GATEWAY_URL }}
          API_KEY: ${{ secrets.STAGING_API_KEY }}

  # Deploy to Vercel (production)
  deploy-vercel-production:
    name: Deploy to Vercel (Production)
    needs: [deploy-vercel-staging]
    runs-on: ubuntu-latest
    environment: vercel-production

    # Only run on manual dispatch to production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Install Vercel CLI
      - name: Install Vercel CLI
        run: npm install -g vercel

      # Run Neon database migrations
      - name: Run Neon database migrations
        run: npm run db:migrate:neon up
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL_PRODUCTION }}

      # Deploy to Vercel (production)
      - name: Deploy to Vercel (production)
        run: vercel --prod --token=${{ secrets.VERCEL_TOKEN }} --yes
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Run deployment verification tests
      - name: Run deployment verification tests (Vercel)
        run: npm run test:deployment -- --run
        env:
          GATEWAY_URL: ${{ secrets.VERCEL_PRODUCTION_GATEWAY_URL }}
          API_KEY: ${{ secrets.PRODUCTION_API_KEY }}

  # Deploy to Cloudflare (production)
  deploy-cloudflare-production:
    name: Deploy to Cloudflare (Production)
    needs: [deploy-cloudflare-staging]
    runs-on: ubuntu-latest
    environment: production

    # Only run on manual dispatch to production
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'

    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # Download build artifacts
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: build-artifacts

      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      # Install dependencies
      - name: Install dependencies
        run: npm ci

      # Setup Cloudflare CLI
      - name: Setup Cloudflare CLI
        run: npm install -g wrangler

      # Create deployment backup
      - name: Create deployment backup
        run: node scripts/deploy.js backup production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PRODUCTION }}

      # Run database migrations
      - name: Run database migrations
        run: node scripts/migrate.js up production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PRODUCTION }}

      # Deploy infrastructure with Terraform
      - name: Deploy infrastructure with Terraform
        run: |
          cd terraform
          terraform init
          terraform plan -var-file=production.tfvars -out=production.tfplan
          terraform apply production.tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PRODUCTION }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID_PRODUCTION }}
          TF_VAR_jwt_secret: ${{ secrets.PRODUCTION_JWT_SECRET }}
          TF_VAR_notification_email_id: ${{ secrets.NOTIFICATION_EMAIL_ID }}

      # Deploy to Cloudflare Workers (production)
      - name: Deploy to Cloudflare Workers (production)
        run: node scripts/deploy.js deploy production
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN_PRODUCTION }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID_PRODUCTION }}
          JWT_SECRET: ${{ secrets.PRODUCTION_JWT_SECRET }}

      # Run deployment verification tests
      - name: Run deployment verification tests
        run: npm run test:deployment -- --run
        env:
          GATEWAY_URL: ${{ secrets.PRODUCTION_GATEWAY_URL }}
          API_KEY: ${{ secrets.PRODUCTION_API_KEY }}
          
      # Run smoke tests
      - name: Run smoke tests
        run: npm run test:smoke -- --run
        env:
          GATEWAY_URL: ${{ secrets.PRODUCTION_GATEWAY_URL }}
          API_KEY: ${{ secrets.PRODUCTION_API_KEY }}

  # Database migration job
  migrate-database:
    name: Migrate Database
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'development' }}
    
    # Only run on manual dispatch
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      # Install dependencies
      - name: Install dependencies
        run: npm ci
        
      # Run database migrations
      - name: Run database migrations
        run: node scripts/migrate.js up ${{ github.event.inputs.environment || 'development' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_${{ github.event.inputs.environment || 'DEVELOPMENT' }} }}

  # Database seeding job
  seed-database:
    name: Seed Database
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'development' }}
    
    # Only run on manual dispatch
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      # Install dependencies
      - name: Install dependencies
        run: npm ci
        
      # Seed database
      - name: Seed database
        run: node scripts/migrate.js seed ${{ github.event.inputs.environment || 'development' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_${{ github.event.inputs.environment || 'DEVELOPMENT' }} }}
  # In
frastructure deployment job
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'development' }}
    
    # Only run on manual dispatch
    if: github.event_name == 'workflow_dispatch'
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Setup Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.0
          
      # Initialize Terraform
      - name: Initialize Terraform
        run: |
          cd terraform
          terraform init
          
      # Plan Terraform changes
      - name: Plan Terraform changes
        run: |
          cd terraform
          terraform plan -var-file=${{ github.event.inputs.environment || 'development' }}.tfvars -out=plan.tfplan
        env:
          TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_cloudflare_zone_id: ${{ secrets.CLOUDFLARE_ZONE_ID }}
          TF_VAR_jwt_secret: ${{ secrets.JWT_SECRET }}
          
      # Apply Terraform changes
      - name: Apply Terraform changes
        run: |
          cd terraform
          terraform apply plan.tfplan

  # Rollback job
  rollback-deployment:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'production' }}
    
    # Only run on manual dispatch with rollback input
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.rollback_version != ''
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      # Install dependencies
      - name: Install dependencies
        run: npm ci
        
      # Rollback deployment
      - name: Rollback deployment
        run: node scripts/rollback.js cloudflare ${{ github.event.inputs.environment || 'production' }} --version=${{ github.event.inputs.rollback_version }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          
      # Verify rollback
      - name: Verify rollback
        run: npm run test:deployment -- --run
        env:
          GATEWAY_URL: ${{ secrets.GATEWAY_URL }}
          API_KEY: ${{ secrets.API_KEY }}

  # Performance testing job
  performance-test:
    name: Performance Testing
    runs-on: ubuntu-latest
    
    # Run on schedule (daily) or manual dispatch
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      # Install dependencies
      - name: Install dependencies
        run: npm ci
        
      # Run performance tests
      - name: Run performance tests
        run: npm run test:performance -- --run
        env:
          GATEWAY_URL: ${{ secrets.STAGING_GATEWAY_URL }}
          API_KEY: ${{ secrets.STAGING_API_KEY }}
          
      # Upload performance results
      - name: Upload performance results
        uses: actions/upload-artifact@v3
        with:
          name: performance-results
          path: test-results/performance/
          retention-days: 30

  # Security scanning job
  security-scan:
    name: Security Scanning
    runs-on: ubuntu-latest
    
    steps:
      # Checkout code
      - name: Checkout code
        uses: actions/checkout@v4
        
      # Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      # Install dependencies
      - name: Install dependencies
        run: npm ci
        
      # Run security audit
      - name: Run security audit
        run: npm audit --audit-level=moderate
        
      # Run dependency check
      - name: Run dependency check
        run: npx audit-ci --moderate
        
      # Run SAST scanning
      - name: Run SAST scanning
        uses: github/super-linter@v4
        env:
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_TYPESCRIPT_ES: true
          VALIDATE_JAVASCRIPT_ES: true